# =====================================================================
# process_templates.yaml  --  Cleanroom LCA step-template library  (v0.1)
# ---------------------------------------------------------------------
# ONE file = the whole library. Each entry under `templates:` is a
# reusable process-step TYPE. The assembler reads a run-sheet row
# (step_type + parameter values), looks up the matching template here,
# evaluates each flow's `amount` formula with those parameter values,
# and emits a Brightway foreground activity whose exchanges are already
# linked (via the `links:` catalog) to the frozen local ecoinvent /
# missing_v3_parameters proxies / biosphere3.
#
# What the ASSEMBLER adds automatically (NOT stored in a template,
# because templates are context-free):
#   * the production exchange (amount = 1, one wafer);
#   * the predecessor link (technosphere, amount = 1) wiring step N to
#     step N-1 in the run sheet.
#
# Basis: one 150 mm wafer. Each flow declares scaling: per_wafer (default),
# only the shared chamber-/bath-level flows (see `batchable` + per-flow
# formulas), matching the batch-sharing rule used in the paper.
#
# Defaults reproduce the measured values from the noted source step;
# a lab overrides the parameters for its own tools/recipes.
# =====================================================================

version: 0.1
functional_basis: "one 150 mm wafer (single-wafer basis)"

# ---------------------------------------------------------------------
# Uncertainty presets (two-tier lognormal scheme; scale = sigma of ln).
# Brightway 'uncertainty type' 2 = lognormal.
# ---------------------------------------------------------------------
uncertainty_presets:
  primary_liquid:       {type: lognormal, scale: 0.060}
  primary_electricity:  {type: lognormal, scale: 0.090}
  primary_gas_in:       {type: lognormal, scale: 0.120}
  primary_gas_emission: {type: lognormal, scale: 0.160}
  flat_tech:            {type: lognormal, scale: 0.136382}
  flat_bio:             {type: lognormal, scale: 0.173205}
  solvent_tech:         {type: lognormal, scale: 0.034641}
  solvent_bio:          {type: lognormal, scale: 0.114891}

# ---------------------------------------------------------------------
# Densities (kg/L) for VOLUME-input liquids. Lab recipes are written in
# mL/L, so liquid amount expressions read e.g. "ipa_mL * rho['ipa'] / 1000".
# Water and aqueous baths are ~1.0, so their mL <-> g is 1:1.
# ---------------------------------------------------------------------
densities:
  water:     1.00     # DI water, rinse tanks
  developer: 1.00     # aqueous developers / TMAH solutions
  ipa:       0.786
  acetone:   0.784
  h2so4:     1.84     # concentrated sulfuric acid
  h2o2:      1.20     # 50% hydrogen peroxide
  hf:        1.15     # 49% hydrofluoric acid
  slurry:    1.20     # colloidal silica/alumina CMP slurry

# ---------------------------------------------------------------------
# Link catalog: named pointers to background (ecoinvent), proxy
# (missing_v3_parameters, RREM-built, location-generic) and biosphere
# targets. Templates reference these by KEY, so an ecoinvent rename is
# fixed in ONE place. This catalog IS the "linking layer".
# ---------------------------------------------------------------------
links:
  elec:                 {database: ecoinvent-3.12-cutoff, name: "market for electricity, medium voltage", location: CH, reference_product: "electricity, medium voltage"}
  # --- regional grids: the run-level `grid` setting swaps EVERY electricity flow to one of
  # these. Grid choice is the single biggest lever in a cleanroom line (same TASE line:
  # 979 kg CO2-eq on DE vs 1408 on TW -- a 1.44x swing). ---
  elec_CH:  {database: ecoinvent-3.12-cutoff, name: "market for electricity, medium voltage", location: CH, reference_product: "electricity, medium voltage"}
  elec_DE:  {database: ecoinvent-3.12-cutoff, name: "market for electricity, medium voltage", location: DE, reference_product: "electricity, medium voltage"}
  elec_FR:  {database: ecoinvent-3.12-cutoff, name: "market for electricity, medium voltage", location: FR, reference_product: "electricity, medium voltage"}
  elec_IT:  {database: ecoinvent-3.12-cutoff, name: "market for electricity, medium voltage", location: IT, reference_product: "electricity, medium voltage"}
  elec_NL:  {database: ecoinvent-3.12-cutoff, name: "market for electricity, medium voltage", location: NL, reference_product: "electricity, medium voltage"}
  elec_JP:  {database: ecoinvent-3.12-cutoff, name: "market for electricity, medium voltage", location: JP, reference_product: "electricity, medium voltage"}
  elec_KR:  {database: ecoinvent-3.12-cutoff, name: "market for electricity, medium voltage", location: KR, reference_product: "electricity, medium voltage"}
  elec_TW:  {database: ecoinvent-3.12-cutoff, name: "market for electricity, medium voltage", location: TW, reference_product: "electricity, medium voltage"}
  elec_CN:  {database: ecoinvent-3.12-cutoff, name: "market group for electricity, medium voltage", location: CN, reference_product: "electricity, medium voltage"}
  elec_US:  {database: ecoinvent-3.12-cutoff, name: "market group for electricity, medium voltage", location: US, reference_product: "electricity, medium voltage"}
  elec_RER: {database: ecoinvent-3.12-cutoff, name: "market group for electricity, medium voltage", location: RER, reference_product: "electricity, medium voltage"}
  # --- HIGH-VOLTAGE variants: use when the fab is fed directly from the HV grid
  # (e.g. the PSI cleanroom). ~12% lower than MV because the MV distribution
  # network's losses and infrastructure are not incurred (CH: 0.01935 vs 0.02193 kg CO2-eq/kWh). ---
  elec_CH_HV:  {database: ecoinvent-3.12-cutoff, name: "market for electricity, high voltage", location: CH, reference_product: "electricity, high voltage"}
